name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: python -m pip install pytest tkinterdnd2
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v
      - name: Testes (Linux, com tela virtual para a janela)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v
