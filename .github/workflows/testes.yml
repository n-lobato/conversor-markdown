name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Windows, sem OCR; o OCR é testado no fluxo do executável)
        if: runner.os == 'Windows'
        run: python -m pytest -v
      - name: Testes (Linux, com OCR e tela virtual para a janela)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb tesseract-ocr tesseract-ocr-por
          xvfb-run -a python -m pytest -v -rs
