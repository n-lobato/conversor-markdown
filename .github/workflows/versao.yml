name: Pacotes (Windows, Mac e Linux)

# Gera e testa os pacotes a cada envio para o ramo main e em cada pull request.
# Para publicar em Releases: Actions > "Pacotes (Windows, Mac e Linux)" > Run workflow,
# marcando "publicar". A versão é a de conversor_markdown.py (VERSAO = "...").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar em Releases a versão indicada em conversor_markdown.py (só no ramo main)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ambiente Python (.venv)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Tesseract (OCR) com português e Inno Setup (instalador)
        shell: pwsh
        run: |
          choco install tesseract innosetup -y --no-progress
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" .\Tesseract-OCR
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata/raw/main/por.traineddata -OutFile .\Tesseract-OCR\tessdata\por.traineddata
          if (-not (Test-Path .\Tesseract-OCR\tessdata\eng.traineddata)) {
            Invoke-WebRequest https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata -OutFile .\Tesseract-OCR\tessdata\eng.traineddata
          }
          .\Tesseract-OCR\tesseract.exe --version

      - name: Testes (inclui OCR)
        run: .\.venv\Scripts\python.exe -m pytest -v -rs

      - name: Ler a versão
        shell: pwsh
        run: |
          $v = (Select-String -Path conversor_markdown.py -Pattern '^VERSAO = "(.+)"').Matches[0].Groups[1].Value
          "VERSAO=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "Versão: $v"

      - name: Gerar o pacote portátil e o instalador
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build_portatil.ps1 -Versao $env:VERSAO

      - name: Testar a versão portátil (.zip)
        shell: pwsh
        run: |
          Expand-Archive "dist\Conversor-Markdown-v$env:VERSAO-windows-x64.zip" -DestinationPath teste_zip
          .\.venv\Scripts\python.exe build\testar_pacote.py "teste_zip\Conversor Markdown\Conversor Markdown.exe" --janela

      - name: Testar o instalador (instalar, usar e desinstalar)
        shell: pwsh
        run: |
          $inst = "dist\Conversor-Markdown-v$env:VERSAO-windows-x64-instalador.exe"
          Start-Process -Wait -FilePath $inst -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART'
          $pasta = "$env:LOCALAPPDATA\Programs\Conversor Markdown"
          if (-not (Test-Path "$pasta\Conversor Markdown.exe")) { throw "Instalador não colocou o programa em $pasta" }
          $chave = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
                   Where-Object { $_.GetValue('DisplayName') -eq 'Conversor Markdown' }
          if (-not $chave) { throw "O programa não aparece em Aplicativos instalados" }
          Write-Output ("Aplicativos instalados: {0} {1}" -f $chave.GetValue('DisplayName'), $chave.GetValue('DisplayVersion'))
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Conversor Markdown.lnk")) { throw "Atalho do menu Iniciar não foi criado" }
          .\.venv\Scripts\python.exe build\testar_pacote.py "$pasta\Conversor Markdown.exe"
          $desinst = Get-ChildItem "$pasta\unins*.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $desinst.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep -Seconds 5
          if (Test-Path "$pasta\Conversor Markdown.exe") { throw "Desinstalação deixou o programa para trás" }
          if (Test-Path "$env:APPDATA\Conversor Markdown") { throw "Desinstalação deixou as preferências para trás" }
          Write-Output "Instalar e desinstalar: OK"

      - uses: actions/upload-artifact@v7
        with:
          name: pacote-windows
          path: |
            dist/*.zip
            dist/*-instalador.exe

  mac:
    # macOS 14: as bibliotecas do Homebrew compiladas aqui rodam do macOS 14 em diante
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          brew install tesseract dylibbundler

      - name: Testes
        run: python -m pytest -v -rs

      - name: Gerar o .dmg
        run: |
          VERSAO=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' conversor_markdown.py)
          bash build/build_mac.sh "$VERSAO"

      - name: Testar o aplicativo sem o Tesseract do Homebrew (só com o que vai no pacote)
        run: |
          brew uninstall --ignore-dependencies tesseract leptonica
          if command -v tesseract; then echo 'O Tesseract do Homebrew ainda está instalado'; exit 1; fi
          python build/testar_pacote.py "dist/mac-app/Conversor Markdown.app/Contents/MacOS/Conversor Markdown" --janela

      - uses: actions/upload-artifact@v7
        with:
          name: pacote-mac
          path: dist/*.dmg

  linux:
    # Ubuntu 22.04 para o programa rodar também em distribuições mais antigas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tesseract-ocr tesseract-ocr-por
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Testes
        run: xvfb-run -a python -m pytest -v -rs

      - name: Gerar o .deb e o .tar.gz
        run: |
          VERSAO=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' conversor_markdown.py)
          bash build/build_linux.sh "$VERSAO"

      - name: Testar o .deb (instalar, usar e remover)
        run: |
          sudo apt-get install -y ./dist/conversor-markdown_*_amd64.deb
          test -f /usr/share/applications/conversor-markdown.desktop
          xvfb-run -a python build/testar_pacote.py "$(command -v conversor-markdown)" --janela
          sudo apt-get remove -y conversor-markdown
          if test -e /opt/conversor-markdown/conversor-markdown; then echo 'remoção falhou'; exit 1; fi

      - name: Testar o .tar.gz (instalar.sh e desinstalar.sh)
        run: |
          mkdir teste_tar && tar -xzf dist/*.tar.gz -C teste_tar
          cd teste_tar/*/ && ./instalar.sh
          test -f ~/.local/share/applications/conversor-markdown.desktop
          xvfb-run -a python "$GITHUB_WORKSPACE/build/testar_pacote.py" ~/.local/bin/conversor-markdown
          ./desinstalar.sh
          if test -e ~/.local/bin/conversor-markdown; then echo 'desinstalar.sh falhou'; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: pacote-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  publicar:
    needs: [windows, mac, linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Impressões digitais (SHA-256) e notas da versão
        run: |
          VERSAO=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' conversor_markdown.py)
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          cd dist
          {
            echo "## Qual arquivo baixar"
            echo
            echo "| Sistema | Arquivo |"
            echo "| --- | --- |"
            echo "| Windows 10 e 11, instalação normal (recomendado) | \`Conversor-Markdown-v$VERSAO-windows-x64-instalador.exe\` |"
            echo "| Windows, versão portátil (pen drive, sem instalar) | \`Conversor-Markdown-v$VERSAO-windows-x64.zip\` |"
            echo "| Mac com chip Apple (M1 ou mais novo) | \`Conversor-Markdown-v$VERSAO-mac-apple-silicon.dmg\` |"
            echo "| Ubuntu, Debian, Mint | \`conversor-markdown_${VERSAO}_amd64.deb\` |"
            echo "| Outras distribuições Linux | \`Conversor-Markdown-v$VERSAO-linux-x64.tar.gz\` |"
            echo
            echo "Na primeira vez, Windows e Mac avisam que o programa não tem assinatura digital comercial. O README explica como abrir assim mesmo."
            echo
            echo "## Impressões digitais (SHA-256)"
            echo
            echo '```'
          } > ../notas.md
          for f in *; do
            sha256sum "$f" | tee "$f.sha256" >> ../notas.md
          done
          {
            echo '```'
            echo
            echo "Gerado pelo GitHub Actions a partir do código deste repositório."
          } >> ../notas.md
          ls -la
          cat ../notas.md

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', env.VERSAO) }}
          name: ${{ format('Conversor Markdown {0}', env.VERSAO) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notas.md
          generate_release_notes: true
